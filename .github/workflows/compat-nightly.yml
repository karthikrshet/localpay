name: Compatibility (nightly)

# Catches drift before users do: new SDK releases, and changes in the real API's
# response shapes (only when the maintainer's test-mode secrets are configured).
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

# Read-only by default; jobs ask for the write access they need.
permissions:
  contents: read

jobs:
  sdk-node-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @localpay/shim-node add -D razorpay@latest
      - run: pnpm vitest run packages/shims scripts/spike/spike.test.ts

  sdk-python-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: pip install --upgrade razorpay
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run scripts/spike/python.test.ts
        env:
          LOCALPAY_PYTHON: python

  upstream-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # opens a compat-gap issue on drift
    env:
      RZP_KEY_ID: ${{ secrets.RZP_TEST_KEY_ID }}
      RZP_KEY_SECRET: ${{ secrets.RZP_TEST_KEY_SECRET }}
      PAYMENT_ID: ${{ secrets.RZP_TEST_PAYMENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RZP_KEY_ID != ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.RZP_KEY_ID != ''
        with:
          node-version: 22
      - name: Record and scrub
        if: env.RZP_KEY_ID != ''
        run: |
          node --experimental-strip-types scripts/record-fixtures.ts fixtures/requests/core.json .fixture-recordings
          node --experimental-strip-types scripts/scrub-fixtures.ts .fixture-recordings
      - name: Compare with committed fixtures
        id: drift
        if: env.RZP_KEY_ID != ''
        run: node --experimental-strip-types scripts/check-drift.ts .fixture-recordings > drift.md
      - name: Open an issue on drift
        if: failure() && steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Upstream API drift detected ($(date -u +%F))" --label compat-gap --body-file drift.md
      - name: Skip without secrets
        if: env.RZP_KEY_ID == ''
        run: echo "RZP_TEST_KEY_ID is not set; skipping upstream recording."
